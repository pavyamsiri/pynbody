[project]
name = "pynbody"
description = "Astronomical N-body/SPH analysis for python"
version = "2.1.1"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "The pynbody team", email = "pynbody@googlegroups.com" }]
license = "GPL-3.0-or-later"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "h5py>=3.0.0",
  "matplotlib>=3.0.0",
  "numpy>=2",
  "scipy>=1.0.0",
  "posix-ipc>=1.1.0",
]

[project.urls]
source = "https://github.com/pynbody/pynbody.git"
download = "https://github.com/pynbody/pynbody/releases"
issues = "https://github.com/pynbody/pynbody/issues"

[dependency-groups]
docs = [
  "camb>=1.6.0",
  "ipython>=3",
  "nbsphinx>=0.9.7",
  "numpydoc>=1.8.0",
  "sphinx>=7,<8.2.0",
  "sphinx-book-theme>=1.1.4",
  "sphinx-copybutton>=0.5.2",
]
tests = [
  "camb>=1.6.0",
  "healpy>=1.18.1",
  "ipython>=9.2.0",
  "pandas>=2.2.3",
  "pytest>=8.3.5",
]

[build-system]
build-backend = "mesonpy"
requires = [
  "meson-python",
  "cython>=0.20",
  "numpy>=2",
]

